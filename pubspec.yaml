name: mineral_cli
description: The official Mineral framework command line interface.
version: 2.0.0-dev.7
repository: https://github.com/mineral-dart/cli

executables:
  mineral: cli

environment:
  sdk: ^3.9.2

# Add regular dependencies here.
dependencies:
  args: ^2.4.2
  code_builder: ^4.10.1
  collection: ^1.19.0
  commander_ui: ^2.4.0
  dart_style: ^3.1.2
  mansion: ^0.1.0
  mineral:
    path: ../core
  path: ^1.9.0
  recase: ^4.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
